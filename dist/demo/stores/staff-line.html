<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://rnedesemnameergeksuo.supabase.co; img-src 'none'; form-action 'none'; base-uri 'none'">
<title>LINE接続確認</title><meta name="robots" content="noindex">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#182c25;font:17px/1.7 system-ui,sans-serif}main{max-width:640px;margin:auto;padding:24px 16px}h1{font-size:1.65rem;line-height:1.5}section{background:white;padding:20px;border:1px solid #c7d3ce;border-radius:12px;margin:20px 0}button,input{font:inherit;max-width:100%;min-width:0}button{min-height:48px;padding:10px 16px;border:1px solid #355a48;border-radius:8px;background:white;color:#183d2d;cursor:pointer}button.primary{background:#17623d;color:white;width:100%;font-weight:bold}button:disabled{opacity:.6;cursor:default}input{width:100%;padding:10px;border:1px solid #667b70;border-radius:6px}label{display:block;margin-bottom:8px}button:focus-visible,input:focus-visible{outline:3px solid #004bd1;outline-offset:3px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}p{overflow-wrap:anywhere}.note{font-size:.9rem}[hidden]{display:none!important}</style>
<main><p class="note">LINE接続の確認用です。店舗への申請・通知・投稿は行いません。</p><h1>店員ログイン</h1>
<button id="login" class="primary" type="button">LINEでログイン</button>
<section><p id="status" role="status" aria-live="polite">LINE接続の確認を準備しています。</p>
<form id="request" hidden><label for="name">店員名</label><input id="name" maxlength="60" autocomplete="off" required><p class="note">管理者が確認できる名前を入力してください。同じ名前でも、別のLINEアカウントは別の申請になります。</p><button class="primary" type="submit">利用を申請する</button></form>
<div class="controls"><button id="refresh" type="button" hidden>再確認</button><button id="logout" type="button">ログアウト</button></div></section>
<p><a href="./staff-register.html">メールで登録・ログインする</a></p><p><a href="./staff-approvals.html">管理者の承認画面</a></p></main>
<script type="module" src="./staff-line-bootstrap.mjs"></script></html>
